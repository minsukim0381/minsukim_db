<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자유게시판 - 로봇소프트웨어과</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .board-container { border: 1px solid #eee; border-radius: 12px; overflow: hidden; background: white; }
        .board-header { padding: 30px; background: #fff; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        
        .sort-menu { display: flex; gap: 10px; margin-bottom: 20px; font-size: 0.9rem; }
        .sort-btn { background: none; border: 1px solid #ddd; padding: 5px 12px; border-radius: 20px; cursor: pointer; color: #666; transition: all 0.2s; }
        .sort-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        .post-item { 
            padding: 20px 30px; 
            border-bottom: 1px solid #f5f5f5; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: background 0.2s;
        }
        .post-item:hover { background-color: #fafafa; }
        .post-item h4 { font-size: 1.1rem; color: #333; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        
        .recommend-count {
            min-width: 45px;
            text-align: center;
            background: #fdf2f2;
            color: #e74c3c;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .recommend-count.zero { background: #f0f0f0; color: #999; }
        .recommend-count.negative { background: #f0f0f0; color: #666; }

        .post-meta { font-size: 0.85rem; color: #888; }
        
        .vote-btns { display: flex; gap: 10px; margin-top: 15px; }
        .vote-btn { 
            background: #fff; border: 1px solid #eee; padding: 8px 16px; border-radius: 8px; cursor: pointer; 
            display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 0.9rem;
        }
        .vote-btn.active.up { background: #eafaf1; color: #27ae60; border-color: #27ae60; }
        .vote-btn.active.down { background: #fdf2f2; color: #e74c3c; border-color: #e74c3c; }
        
        .password-input { border: 1px solid #eee; border-radius: 6px; background: #fafafa; }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><a href="index.html" style="color: white; text-decoration: none;">로봇소프트웨어과</a></div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-item">홈으로</a></li>
                <li><a href="board.html" class="nav-item active">자유게시판</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-section">
        <!-- Board List -->
        <section id="board-list-view">
            <div class="board-header-wrapper" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-size: 1.8rem; color: var(--primary-color);">자유게시판</h2>
                <button id="write-btn" class="primary-btn">+ 새 글 작성</button>
            </div>

            <div class="sort-menu">
                <button class="sort-btn active" data-sort="latest">최신순</button>
                <button class="sort-btn" data-sort="oldest">오래된 순</button>
                <button class="sort-btn" data-sort="popular">추천순</button>
            </div>

            <div class="board-container">
                <div id="post-list" class="post-list">
                    <div class="loading">게시글을 불러오는 중...</div>
                </div>
            </div>
        </section>

        <!-- Write/Edit Form -->
        <section id="write-view" class="form-container hidden">
            <h2 id="form-title">게시글 작성</h2>
            <form id="post-form">
                <input type="hidden" id="post-id">
                <div class="form-group">
                    <label for="title">제목</label>
                    <input type="text" id="title" required placeholder="제목을 입력하세요">
                </div>
                <div class="form-group" style="display: flex; gap: 20px;">
                    <div style="flex: 1;">
                        <label for="author">작성자</label>
                        <input type="text" id="author" required placeholder="이름">
                    </div>
                    <div style="flex: 1;">
                        <label for="password">삭제 비밀번호</label>
                        <input type="password" id="password" required placeholder="비밀번호 4자리">
                    </div>
                </div>
                <div class="form-group">
                    <label for="content">내용</label>
                    <textarea id="content" rows="10" required placeholder="내용을 입력하세요"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="secondary-btn" id="cancel-btn">취소</button>
                    <button type="submit" class="primary-btn">저장하기</button>
                </div>
            </form>
        </section>

        <!-- Post Detail View -->
        <section id="detail-view" class="view-container hidden">
            <div id="post-detail"></div>
            <hr>
            <div class="comment-section">
                <h3>댓글</h3>
                <div id="comment-list"></div>
                <form id="comment-form">
                    <div class="comment-input-group">
                        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                            <input type="text" id="comment-author" placeholder="이름" required style="flex: 1;">
                            <input type="password" id="comment-password" placeholder="비밀번호" required style="flex: 1;">
                        </div>
                        <textarea id="comment-content" placeholder="댓글을 입력하세요" required></textarea>
                        <button type="submit" class="primary-btn">댓글 등록</button>
                    </div>
                </form>
            </div>
            <div class="view-actions" style="margin-top: 30px;">
                <button class="secondary-btn" id="back-to-list">목록으로</button>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/board.js"></script>
    <script src="js/board-ui.js"></script>
</body>
</html>
